name: Deploy React to S3 + CloudFront

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
    paths-ignore:
      - "**.md"
      - "**/README*"

concurrency:
  group: backend-develop
  cancel-in-progress: true

jobs:
  ci:
    name: CI (Build)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          cd Zeebra
          npm ci

      - name: Build
        env:
          # 빌드 타임 환경변수 (GitHub Secrets에서 가져오기)
          TOSS_PAYMENT_CLIENT_KEY: ${{ secrets.REACT_TOSS_PAYMENT_CLIENT_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          REACT_APP_ENV: "dev"
        run: |
          cd Zeebra
          npm run build
  cd:
    name: CD (Deploy to S3 via SSM)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          cd Zeebra
          npm ci

      - name: Build
        env:
          TOSS_PAYMENT_CLIENT_KEY: ${{ secrets.REACT_TOSS_PAYMENT_CLIENT_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          REACT_APP_ENV: "dev"
        run: |
          cd Zeebra
          npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync build folder to S3
        run: |
          aws s3 sync Zeebra/dist/ s3://${{ secrets.AWS_S3_BUCKET }} \
            --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
